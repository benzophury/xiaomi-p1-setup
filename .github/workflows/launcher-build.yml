name: Build launcher

# Triggered automatically when the sync workflow pushes new launcher source,
# and manually for one-off builds.
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK from launcher/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from launcher/app/build.gradle
        id: ver
        run: |
          VERSION_NAME=$(grep -oP "versionName '\K[^']+" launcher/app/build.gradle)
          VERSION_CODE=$(grep -oP "versionCode \K\d+" launcher/app/build.gradle)
          UPSTREAM_TAG=$(cat .github/launcher-version 2>/dev/null || echo "unknown")
          echo "version_name=${VERSION_NAME}"   >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}"   >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}"   >> "$GITHUB_OUTPUT"
          echo "apk_name=tvhome-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME}  versionCode=${VERSION_CODE}  upstream=${UPSTREAM_TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: launcher/
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -q --console=plain
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Stage APK
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "${{ steps.ver.outputs.apk_name }}"
          echo "Built: ${{ steps.ver.outputs.apk_name }} ($(du -h "${{ steps.ver.outputs.apk_name }}" | cut -f1))"

      - name: Update tvhome.apk in repo
        run: |
          cp "${{ steps.ver.outputs.apk_name }}" tvhome.apk
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvhome.apk
          git diff --cached --quiet \
            && echo "tvhome.apk unchanged" \
            || git commit -m "launcher: built tvhome.apk v${{ steps.ver.outputs.version_name }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ steps.ver.outputs.version_name }}
          name: "CleanYourTV Launcher ${{ steps.ver.outputs.version_name }}"
          body: |
            **CleanYourTV Launcher ${{ steps.ver.outputs.version_name }}** (versionCode ${{ steps.ver.outputs.version_code }})

            Source synced from upstream [${{ steps.ver.outputs.upstream_tag }}](https://github.com/Gathin23/cleanyourtv/releases/tag/${{ steps.ver.outputs.upstream_tag }}) and built here with JDK 17 + Android SDK 34, debug-signed.

            **Install on your Xiaomi P1:**
            ```bash
            git pull && ./scripts/launcher.sh
            ```

            **Upstream changelog:** https://github.com/Gathin23/cleanyourtv/releases/tag/${{ steps.ver.outputs.upstream_tag }}
          files: ${{ steps.ver.outputs.apk_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
