name: Launcher

# Triggered by a schedule (daily check) or manually.
# Compares the latest cleanyourtv tag against the tag recorded in
# .github/launcher-version, and only builds + releases when it is newer.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if version already released'
        type: boolean
        default: false

permissions:
  contents: write   # create releases and commit version file

jobs:
  check:
    name: Check for new upstream version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version_name: ${{ steps.upstream.outputs.version_name }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest cleanyourtv tag
        id: upstream
        run: |
          RELEASE=$(curl -fsSL https://api.github.com/repos/Gathin23/cleanyourtv/releases/latest)
          TAG=$(echo "$RELEASE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tag_name'])")
          # versionName lives inside the tag's launcher/app/build.gradle — fetch it from the raw tree
          VERSION_NAME=$(curl -fsSL \
            "https://raw.githubusercontent.com/Gathin23/cleanyourtv/${TAG}/launcher/app/build.gradle" \
            | grep -oP "versionName '\K[^']+")
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: ${TAG}  versionName: ${VERSION_NAME}"

      - name: Compare with last built version
        id: compare
        run: |
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          LAST_TAG=""
          if [ -f .github/launcher-version ]; then
            LAST_TAG=$(cat .github/launcher-version)
          fi
          echo "Last built: ${LAST_TAG:-none}   Upstream: ${UPSTREAM_TAG}"
          if [ "$FORCE" = "true" ] || [ "$UPSTREAM_TAG" != "$LAST_TAG" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "→ Will build"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "→ Already up to date"
          fi

  build:
    name: Build APK (cleanyourtv ${{ needs.check.outputs.tag }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.locate.outputs.apk_path }}
      apk_name: ${{ steps.locate.outputs.apk_name }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Checkout cleanyourtv at ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ needs.check.outputs.tag }}
          path: cleanyourtv

      - name: Build launcher APK
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -q --console=plain
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Locate APK
        id: locate
        working-directory: cleanyourtv/launcher
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=cleanyourtv/launcher/${APK}" >> "$GITHUB_OUTPUT"
          # Name it with the version so it is unambiguous in the release assets
          VER="${{ needs.check.outputs.version_name }}"
          echo "apk_name=tvhome-${VER}.apk"          >> "$GITHUB_OUTPUT"
          echo "APK: ${APK}  ($(du -h "cleanyourtv/launcher/${APK}" | cut -f1))"

      - name: Upload APK artifact (pass to release job)
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 1

  release:
    name: Release launcher-${{ needs.check.outputs.version_name }}
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION_NAME: ${{ needs.check.outputs.version_name }}
      APK_NAME: ${{ needs.build.outputs.apk_name }}
    steps:
      - name: Checkout (to update launcher-version)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: tvhome-apk
          path: dist/

      - name: Rename APK
        run: mv dist/*.apk "dist/${APK_NAME}"

      - name: Update tvhome.apk in repo
        run: |
          cp "dist/${APK_NAME}" tvhome.apk
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tvhome.apk .github/launcher-version
          git diff --cached --quiet || git commit -m "launcher: update tvhome.apk to cleanyourtv ${TAG}"

      - name: Record version
        run: |
          echo "${TAG}" > .github/launcher-version
          git add .github/launcher-version
          git diff --cached --quiet || git commit -m "ci: record launcher version ${TAG}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ env.VERSION_NAME }}
          name: "CleanYourTV Launcher ${{ env.VERSION_NAME }}"
          body: |
            **CleanYourTV Launcher ${{ env.VERSION_NAME }}** built from upstream tag [${{ env.TAG }}](https://github.com/Gathin23/cleanyourtv/releases/tag/${{ env.TAG }}).

            Built with JDK 17 + Android SDK 34, signed with the debug key (same as the upstream build process). Install over ADB:

            ```bash
            # Update tvhome.apk in this repo, then re-run the launcher script:
            ./scripts/launcher.sh

            # Or push manually:
            adb connect <TV_IP>
            adb install -r tvhome.apk
            ```

            **Changes in this release:** see the [upstream release notes](https://github.com/Gathin23/cleanyourtv/releases/tag/${{ env.TAG }}).
          files: dist/${{ env.APK_NAME }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
