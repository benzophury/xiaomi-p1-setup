# xiaomi-p1-setup configuration file
# Sourced by all scripts. Edit this file to match your setup.
# Lines starting with # are comments. Blank lines are ignored.

# ─── TV Connection ────────────────────────────────────────────────────────────

# IP address of the TV on your local network.
# Find it under Settings → Network → Wi-Fi → (your network name).
# Required. All scripts fail fast if this is empty.
TV_IP=""           # e.g. "192.168.1.100"

# ADB port. 5555 is the Android default; almost never needs changing.
TV_PORT="5555"

# ─── NextDNS / Private DNS ────────────────────────────────────────────────────

# Your NextDNS configuration ID (the hex string from nextdns.io/setup).
# When set, debloat.sh will configure Android Private DNS (DoT) to
# <NEXTDNS_ID>.dns.nextdns.io, which routes all TV DNS through NextDNS.
# Leave empty to skip Private DNS configuration.
NEXTDNS_ID=""      # e.g. "abc123"  → uses abc123.dns.nextdns.io

# ─── Projectivy Launcher ──────────────────────────────────────────────────────

# Absolute path to the Morphe-patched Projectivy APK on this machine.
# See README.md → "Projectivy + Morphe Patch" for patching instructions.
# Leave empty to skip launcher installation entirely.
PROJECTIVY_APK=""  # e.g. "/home/you/Downloads/projectivy-patched.apk"

# ─── Apps to Keep ─────────────────────────────────────────────────────────────

# Comma-separated package names of streaming apps to KEEP enabled.
# Any package listed in data/packages.txt that also appears here is skipped
# during debloat. Edit to match what you actually watch.
# Defaults: YouTube TV, Netflix, Prime Video.
KEEP_APPS="com.google.android.youtube.tv,com.netflix.ninja,com.amazon.amazonvideo.livingroom"

# ─── UI Animation Speed ───────────────────────────────────────────────────────

# Multiplier applied to window_animation_scale and transition_animation_scale.
# 0.5 = snappier (recommended)
# 0.0 = instant (can feel broken on some firmware)
# 1.0 = stock Android default
# Note: animator_duration_scale is intentionally left at 1.0 — setting it to
# 0.5 breaks Settings navigation on Xiaomi TV firmware.
ANIMATION_SCALE="0.5"

# ─── Voice Assistant ──────────────────────────────────────────────────────────

# true  → clears the voice interaction service and disables OK-Google detection.
# false → leaves voice assistant untouched.
DISABLE_VOICE="true"

# ─── OTA Updates ──────────────────────────────────────────────────────────────

# true  → com.xiaomi.mitv.updateservice is included in the disable list,
#          blocking Xiaomi's OTA update mechanism.
# false → OTA updater is left enabled (it will still run in the background).
# Remember to re-enable it before applying a firmware update you actually want.
DISABLE_OTA="true"

# ─── HDMI Input Labels (Projectivy) ───────────────────────────────────────────

# Human-readable label=input_id pairs for the HDMI inputs shown in Projectivy.
# Comma-separated. The label is what Projectivy shows; the id is the Android TV
# input identifier (visible via `adb shell dumpsys tv_input`).
# Leave as-is if you don't use Projectivy or don't need custom labels.
HDMI_LABELS="HDMI 1=hdmi1,HDMI 2=hdmi2"
